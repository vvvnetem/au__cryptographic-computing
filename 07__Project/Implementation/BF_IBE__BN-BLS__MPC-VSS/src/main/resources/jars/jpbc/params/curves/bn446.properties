###############################################################################
#  BN446 Curve Parameters for JPBC (Type F)
#
#	#  TODO: Review needed ==> sage
#
#  Notes:
#    - Embedding degree k = 12 (BN family)
#    - Prime field and group order are both 446-bit primes
#    - h = 1 prime-order curve (r = q)
###############################################################################

# Curve type: BN / Type F pairing
type = f

###############################################################################
#  Base field prime q (Fp modulus)
#  Defines the finite field Fp.
###############################################################################
q = 16798108731015832284940804142231733909759579603404752749028378864165570215949

###############################################################################
#  Group order r
#  Order of both G1 and G2.
#  For BN curves, r is typically equal to q when cofactor h = 1.
###############################################################################
r = 16798108731015832284940804142231733909759579603404752749028378864165570215949

###############################################################################
#  Cofactor h = (q + 1  t) / r
#  When h = 1, the curve has prime order and is ideal for cryptographic use.
###############################################################################
h = 1

###############################################################################
#  Embedding degree k
#  BN curves always have k = 12.
###############################################################################
k = 12

###############################################################################
#  Parameters used internally by JPBC for constructing the BN field tower
#  exp2, exp1, sign0, sign1 specify the BN polynomial family.
#
#  For BN curves:
#     r(x) = 36x^4 + 36x^3 + 18x^2 + 6x + 1
#     q(x) = 36x^4 + 36x^3 + 24x^2 + 6x + 1
###############################################################################
exp2 = 224     # BN parameter x decomposition (high bits)
exp1 = 224     # BN parameter x decomposition (low bits)
sign1 = -1     # sign bits defining BN parameter x
sign0 = 0

###############################################################################
#  Elliptic curve equation coefficient:
#     E: y² = x³ + b  over Fp
#  Your BN446 curve uses b = 5.
###############################################################################
b = 5

###############################################################################
#  β (beta): quadratic non-residue used to construct Fp2
#  Fp2 = Fp[u] / (u² - beta)
#  beta = 1 is valid (u² - 1 is irreducible in this field)
###############################################################################
beta = 1

###############################################################################
#  ξ₀ (xi0): constant used in constructing Fp12 from Fp2
#  (used in the cyclotomic and Frobenius mappings)
###############################################################################
xi0 = 1
