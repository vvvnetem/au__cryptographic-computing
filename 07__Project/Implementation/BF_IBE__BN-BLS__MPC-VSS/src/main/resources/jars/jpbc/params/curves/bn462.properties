# BN parameter decomposition (JPBC internal)
# These should match how JPBC expects the BN parameter x to be split.
exp2 = 239
exp1 = 223
sign1 = -1
sign0 = 0

# Elliptic curve: y^2 = x^3 + b
b = 3

# Quadratic non-residue for Fp2: Fp2 = Fp[u] / (u^2 - beta)
beta = 1

# Fp12 construction parameter(s)
xi0 = 1

# alpha0, alpha1: parameters used by JPBC for constructing Fp12 (common choice)
# This matches the standard BN / alt_bn128 Fp12 construction used by many JPBC examples.
alpha0 = 0
alpha1 = 1

